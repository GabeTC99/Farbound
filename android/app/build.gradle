plugins { id 'com.android.application' }

android {
    namespace 'com.farbound.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.farbound.game'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.1.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs = ['../../dist'] } }
    androidResources { ignoreAssetsPattern '!.git:!.svn:!*.zip:!sw.js' }
}
