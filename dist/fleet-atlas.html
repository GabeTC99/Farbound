<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nullharbor · Fleet Atlas 2.16.3</title>
<style>
body{margin:0;background:#070d17;color:#c8dde6;font:14px/1.4 system-ui;padding:20px}
h1{font-weight:500;letter-spacing:.08em;font-size:14px;color:#83d7c4;text-transform:uppercase}
h2{font-weight:500;font-size:13px;color:#9eb7bd;margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#0b1723;border:1px solid #29404c;border-radius:10px;padding:12px}
.card canvas,.card svg{display:block;width:100%;height:100px;background:radial-gradient(circle at 30% 20%,#163044,#08141c 70%);border-radius:8px}
#canvas .card canvas,#npc .card canvas{height:140px}
.card b{display:block;margin-top:8px;color:#d7f7ef}
.card span{color:#8aa7b4;font-size:12px}
.stars{display:flex;flex-wrap:wrap;gap:16px}
.star-card{text-align:center}
.star-card canvas{background:#050a12;border-radius:10px;border:1px solid #1c2c36;width:280px;height:280px}
</style>
</head>
<body>
<h1>Fleet Atlas 2.15.4 · sharp stars</h1>
<h2>Hangar previews</h2>
<div class="grid" id="svg"></div>
<h2>Local-space hulls</h2>
<div class="grid" id="canvas"></div>
<h2>NPC / traffic / security</h2>
<div class="grid" id="npc"></div>
<h2>Spectral stars</h2>
<div class="stars" id="stars"></div>
<script type="module">
import {SHIPS} from './core.mjs';
import {hullPreviewSvg,drawCraft,NPC_KINDS} from './ship-render.mjs';
import {drawStarBody,STAR_ART} from './star-render.mjs';
import {STAR_TYPES} from './system-layout.mjs';

function paintShip(kind,size,color,accent,hostile=false){
 const c=document.createElement('canvas');c.width=440;c.height=176;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#071018';ctx.fillRect(0,0,440,176);
 ctx.translate(220,88);
 drawCraft(ctx,{kind,size:Math.max(38,size*2.8),color,accent,thrust:.7,clock:.3,lightX:-1,lightY:-.7,hostile});
 return c;
}
const svg=$('svg'),cans=$('canvas'),npc=$('npc');
function $(id){return document.getElementById(id)}
for(const ship of SHIPS){
 const card=document.createElement('div');card.className='card';
 card.innerHTML=hullPreviewSvg(ship)+`<b>${ship.name}</b><span>${ship.role} · ${ship.class}</span>`;
 svg.appendChild(card);
 const ccard=document.createElement('div');ccard.className='card';
 ccard.appendChild(paintShip(ship.id,ship.size,ship.color,ship.accent));
 ccard.insertAdjacentHTML('beforeend',`<b>${ship.name}</b><span>flight canvas</span>`);
 cans.appendChild(ccard);
}
const extras=[
 ['pirate','Pirate','#ee918b','#d47868',true],
 ['security','Security','#9eb7bd','#3b8cff',false],
 ['courier','Courier','#7ec8d8','#7ec8d8',false],
 ['freighter','Freighter','#d2b48c','#d2b48c',false],
 ['prospector','Prospector','#d4a067','#d4a067',false],
 ['tender','Tender','#e0b07a','#e0b07a',false],
 ['surveyor','Surveyor','#8fd6c2','#8fd6c2',false]
];
for(const [kind,name,color,accent,hostile] of extras){
 const card=document.createElement('div');card.className='card';
 card.appendChild(paintShip(kind,18,color,accent,hostile));
 card.insertAdjacentHTML('beforeend',`<b>${name}</b><span>${kind}</span>`);
 npc.appendChild(card);
}
void NPC_KINDS;
const stars=$('stars');
for(const id of Object.keys(STAR_ART)){
 const wrap=document.createElement('div');wrap.className='star-card';
 const c=document.createElement('canvas');c.width=280;c.height=280;
 const ctx=c.getContext('2d');ctx.fillStyle='#050a12';ctx.fillRect(0,0,280,280);
 drawStarBody(ctx,{x:140,y:140,r:78,spectral:id,id:'preview-'+id},{lite:false,pixelScale:1});
 wrap.appendChild(c);wrap.insertAdjacentHTML('beforeend',`<div><b>${id}</b> · ${STAR_TYPES[id]?.label||''}</div>`);
 stars.appendChild(wrap);
}
</script>
</body>
</html>
